<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>home-server</title>
<style>:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6e6e73;--line:#e3e1dc;--accent:#2f6fde}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--card:#1b1c1f;--ink:#ececee;--muted:#9a9aa1;--line:#2c2d31;--accent:#6ea0ff}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,sans-serif;padding:24px 16px}
main{max-width:640px;margin:0 auto}h1{font-size:22px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;color:var(--ink);text-decoration:none}
a.card b{color:var(--accent)}a.card span{display:block;color:var(--muted);font-size:14px}</style></head>
<body><main><h1>home-server</h1>
<a class="card" href="axella/"><b>Axella</b><span>Message digests, priorities and drafts</span></a>
</main></body></html>
